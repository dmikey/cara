name: Android GLES ARM64

on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run only standalone ARM64 EGL fixtures
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rg-slide:
    if: ${{ !inputs.probe_only }}
    name: Build exact main ARM64 release APK for local signing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and inspect release APK
        working-directory: emulator/src/android
        run: |
          cat > "$RUNNER_TEMP/rg-slide-profile.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.pluginManager.withPlugin('com.android.application') {
                  project.androidComponents.finalizeDsl { android ->
                      android.defaultConfig.versionCode = 275
                  }
              }
          }
          GRADLE
          sed -i '/<\/application>/i\        <profileable android:shell="true" />' app/src/main/AndroidManifest.xml
          sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }|g' build.gradle
          gradle --no-daemon --max-workers=3 --init-script "$RUNNER_TEMP/rg-slide-profile.init.gradle" :app:assembleRelease -x :app:lintVitalAnalyzeRelease -x :app:lintVitalReportRelease -x :app:lintVitalRelease -PcaraOrderedGles=ON -PcaraGlesAtlas=ON -PcaraCpuJit=true
          git restore build.gradle app/src/main/AndroidManifest.xml
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/rg-slide"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="$RUNNER_TEMP/rg-slide/Cara-Android-main-arm64-unsigned.apk"
          "$build_tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/rg-slide/apk-badging.txt"
          grep "^package: name='org.cara.emu'" "$RUNNER_TEMP/rg-slide/apk-badging.txt"
          native="$(find app/build/intermediates/cxx -path '*/obj/arm64-v8a/libmain.so' -print -quit)"
          test -n "$native"
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"             -n -S -C --defined-only "$native" | gzip > "$RUNNER_TEMP/rg-slide/native-symbols.txt.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/rg-slide/source-revision.txt"
          cp "$build_tools/lib/apksigner.jar" "$RUNNER_TEMP/rg-slide/"
      - uses: actions/upload-artifact@v4
        with:
          name: cara-rg-slide-pica-cpu-apk
          path: ${{ runner.temp }}/rg-slide/*
          if-no-files-found: error

  ordered-gles-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build original and thread-local dispatch probes
        run: |
          compiler="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++"
          for mode in original tls; do
            tools/build-android-ordered-gles-probe.sh "$RUNNER_TEMP/probes/$mode" "$compiler" "$mode"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cara-ordered-gles-probe
          path: ${{ runner.temp }}/probes/*/cara_ordered_gles_probe
          if-no-files-found: error
