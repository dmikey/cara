name: Android GLES ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rg-slide:
    name: Build exact main ARM64 release APK for local signing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e28483f8fd6f5bfa795b697148c08f6287940221
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and inspect release APK
        working-directory: emulator/src/android
        run: |
          test "$(git rev-parse HEAD)" = e28483f8fd6f5bfa795b697148c08f6287940221
          gradle --no-daemon --max-workers=3 :app:assembleRelease -PcaraGlesAtlas=ON -PcaraCpuJit=true
          mkdir -p "$RUNNER_TEMP/rg-slide"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="$RUNNER_TEMP/rg-slide/Cara-Android-main-arm64-unsigned.apk"
          "$build_tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/rg-slide/apk-badging.txt"
          grep "^package: name='org.cara.emu'" "$RUNNER_TEMP/rg-slide/apk-badging.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/rg-slide/source-revision.txt"
          cp "$build_tools/lib/apksigner.jar" "$RUNNER_TEMP/rg-slide/"
      - uses: actions/upload-artifact@v4
        with:
          name: cara-rg-slide-main-apk
          path: ${{ runner.temp }}/rg-slide/*
          if-no-files-found: error
