name: Android GLES ARM64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'emulator/CMakeLists.txt'
      - 'emulator/src/android/**'
      - 'emulator/src/video_core/renderer_opengl/**'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build ARM64 GLES debug APK with Dynarmic and FastInterp
        working-directory: emulator/src/android
        run: gradle --no-daemon --max-workers=3 :app:assembleDebug
      - name: Verify the APK
        run: |
          apk=emulator/src/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -l "$apk" | grep 'lib/arm64-v8a/libmain.so'
          native="$(find emulator/src/android/app/build/intermediates/cxx -path '*/obj/arm64-v8a/libmain.so' -print -quit)"
          test -n "$native"
          tools="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$tools/llvm-readelf" -h "$native" > android-native-header.txt
          "$tools/llvm-nm" -C --defined-only "$native" > "$RUNNER_TEMP/android-native-symbols.txt"
          grep -F 'AArch64' android-native-header.txt
          grep -F 'ARM_Dynarmic::Run()' "$RUNNER_TEMP/android-native-symbols.txt"
          grep -F 'ARM_FastInterp::Run()' "$RUNNER_TEMP/android-native-symbols.txt"
          if grep -Eq 'JitShader::|ShaderJit::' "$RUNNER_TEMP/android-native-symbols.txt"; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cara-android-arm64-gles-cpu-jit
          if-no-files-found: error
          path: emulator/src/android/app/build/outputs/apk/debug/app-debug.apk
