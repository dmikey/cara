name: No-JIT builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.renderer }} / ARM64 / no JIT
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            renderer: software
            suffix: ''
          - platform: ios
            renderer: gles3
            suffix: '-gles3'
          - platform: mac
            renderer: software
            suffix: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        run: |
          python3 -m venv work/tools
          work/tools/bin/python -m pip install cmake==3.31.10 ninja==1.13.2
          echo "$PWD/work/tools/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          uname -m
      - name: Validate bundled source (no fetch)
        run: python3 tools/prepare.py
      - name: Build
        run: python3 tools/build.py '${{ matrix.platform }}' --renderer '${{ matrix.renderer }}' --jobs 3
      - name: Audit linked no-JIT binary
        run: python3 tools/audit_no_jit.py '${{ matrix.platform }}' --renderer '${{ matrix.renderer }}'
      - name: Native file I/O regression check (no ROM required)
        if: matrix.platform == 'mac'
        run: |
          work/build-mac/bin/citra-no-jit-probe --self-test work/io-self-test
          work/build-mac/bin/citra-core-cache-self-test
          CARA_DISABLE_FAST_DECODE_LOOKUP=1 work/build-mac/bin/citra-core-cache-self-test
          work/build-mac/bin/citra-interval-cache-self-test
          work/build-mac/bin/citra-input-self-test
          CARA_RASTER_THREADS=1 work/build-mac/bin/citra-raster-self-test
          CARA_RASTER_THREADS=4 work/build-mac/bin/citra-raster-self-test
      - name: Package unsigned iOS app
        if: matrix.platform == 'ios'
        run: ditto -c -k --norsrc --noextattr --keepParent 'work/build-ios${{ matrix.suffix }}/bin/citra-ios.app' 'work/Cara-iOS-${{ matrix.renderer }}-unsigned.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: cara-${{ matrix.platform }}-${{ matrix.renderer }}-no-jit
          if-no-files-found: error
          path: |
            work/Cara-iOS-*-unsigned.zip
            work/build-${{ matrix.platform }}${{ matrix.suffix }}/bin/citra-no-jit-probe
            work/build-${{ matrix.platform }}${{ matrix.suffix }}/no-jit-audit.json
