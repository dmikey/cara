name: Release packages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'emulator/**'
      - 'tools/build.py'
      - 'tools/build_mac_sdl.py'
      - 'tools/audit_no_jit.py'
      - 'tools/package_*.py'
      - 'tools/sign_nightly.py'
      - 'tools/sign_android_nightly.py'
      - 'tools/verify_release_candidate.py'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/linux-opengl.yml'
      - '.github/workflows/windows-opengl.yml'
      - 'tools/mac_bundle.py'
      - 'tools/mac_app_launcher.mm'
      - 'tools/mac_runtime.json'
      - 'tools/audit_release_mac.py'
      - 'tests/test_release_packages.py'
  release:
    types: [published]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Build signed prerelease packages from main'
        required: false
        type: boolean
        default: false
      release_candidate:
        description: 'RC version (Cara.RC.YYYYMMDDNN, e.g. Cara.RC.2026112301)'
        required: false
        type: string
      candidate_packages_only:
        description: 'Build all candidate packages as Actions artifacts without release signing or publication'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Existing release tag to build and attach to; leave empty for build artifacts only'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-packages-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || github.event.release.tag_name || inputs.release_candidate || inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  source:
    name: Pin one source commit for release packages
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require a numbered tag for package-only builds
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_packages_only
        env:
          RC_TAG: ${{ inputs.release_candidate }}
        run: test -n "$RC_TAG"
      - name: Validate release candidate request
        if: github.event_name == 'workflow_dispatch' && inputs.release_candidate != ''
        env:
          RC_TAG: ${{ inputs.release_candidate }}
          EXISTING_TAG: ${{ inputs.release_tag }}
          NIGHTLY: ${{ inputs.nightly }}
          PACKAGES_ONLY: ${{ inputs.candidate_packages_only }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_REPOSITORY" = dmikey/cara
          test "$PACKAGES_ONLY" = true || test "$GITHUB_REF" = refs/heads/main
          test -z "$EXISTING_TAG"
          test "$NIGHTLY" = false
          python3 - <<'PYCODE'
          import datetime
          import os
          import re

          version = re.fullmatch(r"Cara[.]RC[.]([0-9]{8})([0-9]{2})", os.environ["RC_TAG"])
          if not version or version[2] == "00":
              raise SystemExit("Use Cara.RC.YYYYMMDDNN with a sequence from 01 to 99.")
          datetime.datetime.strptime(version[1], "%Y%m%d")
          PYCODE
          if gh release view "$RC_TAG" >/dev/null 2>&1; then
            echo "This RC version already has a GitHub Release."
            exit 1
          fi
          if git ls-remote --exit-code "https://github.com/$GH_REPO.git" "refs/tags/$RC_TAG"; then
            echo "This RC version is already tagged."
            exit 1
          else
            test "$?" = 2
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.sha }}
      - name: Check nightly dispatch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
        env:
          EXISTING_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || -n "$EXISTING_TAG" ]]; then
            echo "Nightlies build main and create their own prerelease tag."
            exit 1
          fi
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  mac:
    needs: source
    name: Self-contained macOS arm64 / optional CPU JIT included
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install build-only dependencies
        run: |
          brew install sdl2 libpng sdl3
          python3 -m venv work/tools
          work/tools/bin/python -m pip install cmake==3.31.10 ninja==1.13.2
          echo "$PWD/work/tools/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Packaging policy checks
        run: python3 -m unittest discover -s tests -p test_release_packages.py
      - name: Build Mac app with experimental CPU JIT, shader JIT off
        run: |
          python3 tools/build_mac_sdl.py --atlas --cpu-jit --build-dir work/build-mac-release --jobs 2
          cmake --build work/build-mac-release --target cara-mac-preferences-self-test -j2
          work/build-mac-release/bin/cara-mac-preferences-self-test
      - name: Package native launcher and private dependency closure
        run: |
          python3 tools/package_mac_app.py --build-dir work/build-mac-release --output work/Cara.app --sdl3-library "$(brew --prefix sdl3)/lib/libSDL3.dylib"
          python3 tools/audit_release_mac.py work/Cara.app --report work/mac-release-audit.json
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent work/Cara.app dist/Cara-macOS-arm64-JIT.zip
          cp work/mac-release-audit.json dist/
          cp work/Cara.app/Contents/Resources/build.json dist/mac-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: Cara-macOS-arm64-JIT
          path: dist/*
          if-no-files-found: error
  ios:
    needs: source
    name: iOS arm64 GLES3 / unsigned IPA / no JIT
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install pinned build tools
        run: |
          python3 -m venv work/tools
          work/tools/bin/python -m pip install cmake==3.31.10 ninja==1.13.2
          echo "$PWD/work/tools/bin" >> "$GITHUB_PATH"
          developer=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$developer"
          sdk=$(DEVELOPER_DIR="$developer" xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 26
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
      - name: Build and audit the physical-device app without signing
        run: |
          python3 tools/prepare.py
          python3 tools/build.py ios --renderer gles3 --jobs 2
          python3 tools/audit_no_jit.py ios --renderer gles3
          sdk=$(xcrun vtool -show-build work/build-ios-gles3/bin/cara-ios.app/cara-ios | awk '$1 == "sdk" {print $2}')
          test "${sdk%%.*}" -ge 26
          test "$(plutil -extract UIRequiredDeviceCapabilities.0 raw -o - work/build-ios-gles3/bin/cara-ios.app/Info.plist)" = arm64
      - name: Package sideloading IPA
        run: |
          python3 tools/package_ipa.py --app work/build-ios-gles3/bin/cara-ios.app --audit work/build-ios-gles3/no-jit-audit.json --output dist/Cara-iOS-arm64-GLES3-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Cara-iOS-arm64-GLES3-unsigned
          path: dist/*
          if-no-files-found: error
  publish:
    name: Attach audited binaries to the existing release
    needs: [source, mac, ios]
    if: >-
      (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'Cara.RC.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' &&
      !startsWith(inputs.release_tag, 'Cara.RC.'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Cara-*
          path: dist
          merge-multiple: true
      - name: Checksums and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          test -f dist/Cara-macOS-arm64-JIT.zip
          test -f dist/Cara-iOS-arm64-GLES3-unsigned.ipa
          python3 - <<'PYCODE'
          import json, os
          for path in ('dist/mac-build.json', 'dist/Cara-iOS-arm64-GLES3-unsigned.ipa.json'):
              assert json.load(open(path))['source_revision'] == os.environ['EXPECTED_SHA'], 'Source mismatch: ' + path
          PYCODE
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt)
          case "$RELEASE_TAG" in ""|-*) echo "Invalid release tag" >&2; exit 1;; esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/* SHA256SUMS.txt --clobber

  nightly-sign:
    name: Sign the audited Apple prerelease packages
    needs: [source, mac, ios]
    if: github.repository == 'dmikey/cara' && github.ref == 'refs/heads/main' && !inputs.candidate_packages_only && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release_candidate != '')))
    runs-on: macos-15
    timeout-minutes: 35
    environment: nightly-signing
    outputs:
      signed: ${{ steps.result.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Cara-macOS-arm64-JIT
          path: work/unsigned-mac
      - uses: actions/download-artifact@v4
        with:
          name: Cara-iOS-arm64-GLES3-unsigned
          path: work/unsigned-ios
      - name: Sign and notarize the Mac nightly
        id: mac
        env:
          CARA_MAC_CERTIFICATE_BASE64: ${{ secrets.CARA_MAC_CERTIFICATE_BASE64 }}
          CARA_MAC_CERTIFICATE_PASSWORD: ${{ secrets.CARA_MAC_CERTIFICATE_PASSWORD }}
          CARA_NOTARY_KEY_BASE64: ${{ secrets.CARA_NOTARY_KEY_BASE64 }}
          CARA_NOTARY_KEY_ID: ${{ secrets.CARA_NOTARY_KEY_ID }}
          CARA_NOTARY_ISSUER_ID: ${{ secrets.CARA_NOTARY_ISSUER_ID }}
        run: |
          python3 tools/sign_nightly.py mac --artifact-dir work/unsigned-mac \
            --output work/signed/Cara-macOS-arm64-JIT-signed.zip
      - name: Sign the iOS nightly with App Store distribution provisioning
        if: inputs.release_candidate == ''
        id: ios
        env:
          CARA_IOS_CERTIFICATE_BASE64: ${{ secrets.CARA_IOS_CERTIFICATE_BASE64 }}
          CARA_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CARA_IOS_CERTIFICATE_PASSWORD }}
          CARA_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.CARA_IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          python3 tools/sign_nightly.py ios --artifact-dir work/unsigned-ios \
            --output work/signed/Cara-iOS-arm64-GLES3-signed.ipa
      - uses: actions/upload-artifact@v4
        if: steps.mac.outputs.signed == 'true' && (inputs.release_candidate != '' || steps.ios.outputs.signed == 'true')
        with:
          name: nightly-signed
          path: work/signed/*
          if-no-files-found: error
      - id: result
        if: steps.mac.outputs.signed == 'true' && (inputs.release_candidate != '' || steps.ios.outputs.signed == 'true')
        run: echo "signed=true" >> "$GITHUB_OUTPUT"
  rc-android:
    name: Build Android release candidate
    needs: source
    if: github.repository == 'dmikey/cara' && github.event_name == 'workflow_dispatch' && inputs.release_candidate != ''
    uses: ./.github/workflows/android-release.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}

  rc-linux:
    name: Build Linux release candidate
    needs: source
    if: github.repository == 'dmikey/cara' && github.event_name == 'workflow_dispatch' && inputs.release_candidate != ''
    uses: ./.github/workflows/linux-opengl.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}

  rc-windows:
    name: Build Windows release candidate
    needs: source
    if: github.repository == 'dmikey/cara' && github.event_name == 'workflow_dispatch' && inputs.release_candidate != ''
    uses: ./.github/workflows/windows-opengl.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}

  rc-sign-android:
    name: Sign and audit Android release candidate
    needs: [source, rc-android]
    if: github.ref == 'refs/heads/main' && !inputs.candidate_packages_only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nightly-signing
    outputs:
      certificate: ${{ steps.sign.outputs.certificate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Cara-Android-arm64-unsigned
          path: work/unsigned-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Sign matching APK and App Bundle
        id: sign
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          CARA_ANDROID_KEYSTORE_BASE64: ${{ secrets.CARA_ANDROID_KEYSTORE_BASE64 }}
          CARA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CARA_ANDROID_KEYSTORE_PASSWORD }}
          CARA_ANDROID_KEY_ALIAS: ${{ secrets.CARA_ANDROID_KEY_ALIAS }}
          CARA_ANDROID_KEY_PASSWORD: ${{ secrets.CARA_ANDROID_KEY_PASSWORD }}
          CARA_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.CARA_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          python3 tools/sign_android_nightly.py --artifact-dir work/unsigned-android \
            --output work/signed-android --source-revision "$EXPECTED_SHA"
          certificate=$(jq -er '.certificate_sha256' work/signed-android/android-signed.json)
          [[ "$certificate" =~ ^[0-9a-f]{64}$ ]]
          echo "certificate=$certificate" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rc-signed-android
          path: work/signed-android/*
          if-no-files-found: error

  rc-publish:
    name: Publish verified numbered candidate
    needs: [source, ios, nightly-sign, rc-sign-android, rc-linux, rc-windows]
    if: github.repository == 'dmikey/cara' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_candidate != '' && needs.nightly-sign.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nightly-signed
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Cara-iOS-arm64-GLES3-unsigned
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rc-signed-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Cara-Linux-x86_64-OpenGL
          path: work/linux
      - uses: actions/download-artifact@v4
        with:
          name: Cara-Windows-x86_64-OpenGL
          path: work/windows
      - name: Verify exact packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          RC_TAG: ${{ inputs.release_candidate }}
          ANDROID_CERT_SHA256: ${{ needs.rc-sign-android.outputs.certificate }}
        run: |
          cp work/linux/Cara-Linux-x86_64-OpenGL.tar.gz work/linux/linux-build.json dist/
          cp work/windows/Cara-Windows-x86_64-OpenGL.zip work/windows/windows-build.json dist/
          python3 tools/verify_release_candidate.py dist --source-revision "$EXPECTED_SHA" \
            --android-cert-sha256 "$ANDROID_CERT_SHA256"
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt)
          cat > notes.md <<EOF
          Cara release candidate from $EXPECTED_SHA.

          - macOS: Developer ID-signed and notarized arm64 app with optional CPU JIT.
          - iPhone and iPad: unsigned arm64 GLES3 IPA for personal sideloading. Re-sign before installing. TestFlight remains a separate Apple distribution channel.
          - Android: ARM64 APK for direct installation and AAB for Play Console, both signed with the configured upload key. An APK signed by the upload key can differ from the key Play uses for installs.
          - Linux: x86-64 SDL/OpenGL FastInterp build for Ubuntu 24.04.
          - Windows: unsigned x86-64 SDL/OpenGL FastInterp ZIP.

          Verify downloads using SHA256SUMS.txt.
          EOF
          # Reserve the tag atomically so GitHub cannot reuse one created during the build.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$RC_TAG" -f sha="$EXPECTED_SHA" >/dev/null
          gh release create "$RC_TAG" dist/* SHA256SUMS.txt --draft --prerelease --latest=false \
            --verify-tag --title "$RC_TAG" --notes-file notes.md
          gh release edit "$RC_TAG" --draft=false --latest=false
          url=$(gh release view "$RC_TAG" --json url,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == true) | .url')
          test -n "$url"
          printf '%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

  nightly-publish:
    name: Publish signed Apple prerelease
    needs: [source, nightly-sign]
    if: github.repository == 'dmikey/cara' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)) && needs.nightly-sign.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-signed
          path: dist
      - name: Verify and publish matching signed products
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = {
              'Cara-macOS-arm64-JIT-signed.zip': {'signing':'developer-id','notarized':True,'cpu_jit':True},
              'Cara-iOS-arm64-GLES3-signed.ipa': {
                  'signing':'apple-distribution','distribution':'app-store-connect','cpu_jit':False,
              },
          }
          assert {p.name for p in Path('dist').iterdir()} == {
              name + ext for name in assets for ext in ('', '.json')}, 'Unexpected release assets'
          versions = set()
          for name, requirements in assets.items():
              path = Path('dist') / name
              manifest = json.loads(path.with_suffix(path.suffix + '.json').read_text())
              assert manifest['source_revision'] == os.environ['EXPECTED_SHA'], name
              assert manifest['shader_jit'] is False, name
              assert all(manifest.get(k) == v for k,v in requirements.items()), name
              with path.open('rb') as asset:
                  assert manifest['asset_sha256'] == hashlib.file_digest(asset, 'sha256').hexdigest(), name
              versions.add(manifest['build_version'])
          assert len(versions) == 1
          PYCODE
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt)
          stamp=$(date -u +%Y%m%d)
          tag="nightly-$stamp-${EXPECTED_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' \
            "Automated Cara nightly from commit $EXPECTED_SHA." \
            "The macOS app is Developer ID-signed and notarized, with optional ARM64 CPU JIT." \
            "The iOS IPA uses App Store distribution signing for App Store Connect. It requires separate installation or distribution through Apple." \
            "Verify downloaded files using SHA256SUMS.txt." > notes.md
          gh release create "$tag" dist/* SHA256SUMS.txt --draft --prerelease --latest=false \
            --target "$EXPECTED_SHA" --title "Cara Nightly $stamp · ${EXPECTED_SHA:0:12}" --notes-file notes.md
          gh release edit "$tag" --draft=false --latest=false
          url=$(gh release view "$tag" --json url,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == true) | .url')
          test -n "$url"
          printf '%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
