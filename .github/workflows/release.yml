name: Release packages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'emulator/**'
      - 'tools/build.py'
      - 'tools/build_mac_sdl.py'
      - 'tools/audit_no_jit.py'
      - 'tools/package_*.py'
      - 'tools/sign_nightly.py'
      - 'tools/sign_android_nightly.py'
      - 'tools/verify_signed_release.py'
      - 'tools/upload_testflight.py'
      - '.github/workflows/android-release.yml'
      - 'tools/mac_bundle.py'
      - 'tools/mac_app_launcher.mm'
      - 'tools/mac_runtime.json'
      - 'tools/audit_release_mac.py'
      - 'tests/test_release_packages.py'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Sign and upload the iOS build to App Store Connect from main'
        required: false
        type: boolean
        default: false
      nightly:
        description: 'Build signed prerelease packages from main'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Existing RC or stable tag on main. Verified packages go to a draft release.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-packages-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || inputs.testflight && 'testflight' || inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  source:
    name: Validate release route and pin one source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      mode: ${{ steps.source.outputs.mode }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: source
        env:
          NIGHTLY: ${{ inputs.nightly }}
          TESTFLIGHT: ${{ inputs.testflight }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mode=build
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" = schedule || "$NIGHTLY" = true || "$TESTFLIGHT" = true || -n "$RELEASE_TAG" ]]; then
            test "$GITHUB_REPOSITORY" = dmikey/cara
            test "$GITHUB_REF" = refs/heads/main
            if [[ "$TESTFLIGHT" = true ]]; then
              [[ "$NIGHTLY" != true && -z "$RELEASE_TAG" ]] || exit 1
              mode=testflight
            elif [[ "$GITHUB_EVENT_NAME" = schedule || "$NIGHTLY" = true ]]; then
              test -z "$RELEASE_TAG"
              mode=nightly
            else
              [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
                echo "Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER."
                exit 1
              }
              sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
              git merge-base --is-ancestor "$sha" HEAD
              mode=tagged
            fi
          fi
          printf 'sha=%s\nmode=%s\ntag=%s\n' "$sha" "$mode" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  signing-ready:
    name: Check signing credentials before building a release
    needs: source
    if: github.repository == 'dmikey/cara' && github.ref == 'refs/heads/main' && needs.source.outputs.mode != 'build'
    runs-on: ubuntu-latest
    environment: nightly-signing
    outputs:
      android_cert: ${{ steps.config.outputs.android_cert }}
    steps:
      - name: Require every signing credential and certificate pin
        id: config
        env:
          MODE: ${{ needs.source.outputs.mode }}
          CARA_MAC_CERTIFICATE_BASE64: ${{ secrets.CARA_MAC_CERTIFICATE_BASE64 }}
          CARA_MAC_CERTIFICATE_PASSWORD: ${{ secrets.CARA_MAC_CERTIFICATE_PASSWORD }}
          CARA_NOTARY_KEY_BASE64: ${{ secrets.CARA_NOTARY_KEY_BASE64 }}
          CARA_NOTARY_KEY_ID: ${{ secrets.CARA_NOTARY_KEY_ID }}
          CARA_NOTARY_ISSUER_ID: ${{ secrets.CARA_NOTARY_ISSUER_ID }}
          CARA_IOS_CERTIFICATE_BASE64: ${{ secrets.CARA_IOS_CERTIFICATE_BASE64 }}
          CARA_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CARA_IOS_CERTIFICATE_PASSWORD }}
          CARA_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.CARA_IOS_APP_STORE_PROFILE_BASE64 }}
          CARA_ANDROID_KEYSTORE_BASE64: ${{ secrets.CARA_ANDROID_KEYSTORE_BASE64 }}
          CARA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CARA_ANDROID_KEYSTORE_PASSWORD }}
          CARA_ANDROID_KEY_ALIAS: ${{ secrets.CARA_ANDROID_KEY_ALIAS }}
          CARA_ANDROID_KEY_PASSWORD: ${{ secrets.CARA_ANDROID_KEY_PASSWORD }}
          CARA_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.CARA_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r name; do
            if [[ "$MODE" = testflight && "$name" != CARA_IOS_* && "$name" != CARA_NOTARY_* ]]; then
              continue
            fi
            if [[ -z "${!name}" ]]; then
              printf 'Missing release configuration: %s\n' "$name" | tee -a "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done < <(compgen -A variable CARA_)
          test "$missing" -eq 0
          if [[ "$MODE" = testflight ]]; then exit 0; fi
          fingerprint=${CARA_ANDROID_UPLOAD_CERT_SHA256//:/}
          [[ "$fingerprint" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "CARA_ANDROID_UPLOAD_CERT_SHA256 must be a SHA-256 certificate fingerprint."
            exit 1
          }
          printf 'android_cert=%s\n' "$(printf %s "$fingerprint" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  mac:
    needs: [source, signing-ready]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.source.outputs.mode != 'testflight' && (needs.source.outputs.mode == 'build' || needs.signing-ready.result == 'success') }}
    name: Self-contained macOS arm64 / optional CPU JIT included
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install build-only dependencies
        run: |
          brew install sdl2 libpng sdl3
          python3 -m venv work/tools
          work/tools/bin/python -m pip install cmake==3.31.10 ninja==1.13.2
          echo "$PWD/work/tools/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Packaging policy checks
        run: python3 -m unittest discover -s tests -p test_release_packages.py
      - name: Build Mac app with experimental CPU JIT, shader JIT off
        run: |
          python3 tools/build_mac_sdl.py --atlas --cpu-jit --build-dir work/build-mac-release --jobs 2
          cmake --build work/build-mac-release --target cara-mac-preferences-self-test -j2
          work/build-mac-release/bin/cara-mac-preferences-self-test
      - name: Package native launcher and private dependency closure
        run: |
          python3 tools/package_mac_app.py --build-dir work/build-mac-release --output work/Cara.app --sdl3-library "$(brew --prefix sdl3)/lib/libSDL3.dylib"
          python3 tools/audit_release_mac.py work/Cara.app --report work/mac-release-audit.json
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent work/Cara.app dist/Cara-macOS-arm64-JIT.zip
          cp work/mac-release-audit.json dist/
          cp work/Cara.app/Contents/Resources/build.json dist/mac-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: Cara-macOS-arm64-JIT
          path: dist/*
          if-no-files-found: error
  ios:
    needs: [source, signing-ready]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.source.outputs.mode == 'build' || needs.signing-ready.result == 'success') }}
    name: iOS arm64 GLES3 / unsigned IPA / no JIT
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install pinned build tools
        run: |
          python3 -m venv work/tools
          work/tools/bin/python -m pip install cmake==3.31.10 ninja==1.13.2
          echo "$PWD/work/tools/bin" >> "$GITHUB_PATH"
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 26
          xcodebuild -version
      - name: Build and audit the physical-device app without signing
        run: |
          python3 tools/prepare.py
          python3 tools/build.py ios --renderer gles3 --jobs 2
          python3 tools/audit_no_jit.py ios --renderer gles3
      - name: Package sideloading IPA
        run: |
          python3 tools/package_ipa.py --app work/build-ios-gles3/bin/cara-ios.app --audit work/build-ios-gles3/no-jit-audit.json --output dist/Cara-iOS-arm64-GLES3-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Cara-iOS-arm64-GLES3-unsigned
          path: dist/*
          if-no-files-found: error
  android:
    needs: [source, signing-ready]
    if: needs.source.outputs.mode == 'nightly' || needs.source.outputs.mode == 'tagged'
    uses: ./.github/workflows/android-release.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
  sign-android:
    name: Sign and verify the Android release packages
    needs: [source, signing-ready, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nightly-signing
    outputs:
      signed: ${{ steps.android.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Cara-Android-arm64-unsigned
          path: work/unsigned-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Sign matched APK and App Bundle
        id: android
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          CARA_ANDROID_KEYSTORE_BASE64: ${{ secrets.CARA_ANDROID_KEYSTORE_BASE64 }}
          CARA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CARA_ANDROID_KEYSTORE_PASSWORD }}
          CARA_ANDROID_KEY_ALIAS: ${{ secrets.CARA_ANDROID_KEY_ALIAS }}
          CARA_ANDROID_UPLOAD_CERT_SHA256: ${{ needs.signing-ready.outputs.android_cert }}
          CARA_ANDROID_KEY_PASSWORD: ${{ secrets.CARA_ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/sign_android_nightly.py --artifact-dir work/unsigned-android \
            --output work/signed-android --source-revision "$EXPECTED_SHA"
      - uses: actions/upload-artifact@v4
        if: steps.android.outputs.signed == 'true'
        with:
          name: signed-android
          path: work/signed-android/*
          if-no-files-found: error

  sign-apple:
    name: Sign the audited Apple release packages
    needs: [source, signing-ready, mac, ios]
    if: ${{ !cancelled() && needs.signing-ready.result == 'success' && needs.ios.result == 'success' && (needs.source.outputs.mode == 'testflight' || needs.mac.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 35
    environment: nightly-signing
    outputs:
      signed: ${{ steps.result.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: needs.source.outputs.mode != 'testflight'
        with:
          name: Cara-macOS-arm64-JIT
          path: work/unsigned-mac
      - uses: actions/download-artifact@v4
        with:
          name: Cara-iOS-arm64-GLES3-unsigned
          path: work/unsigned-ios
      - name: Sign and notarize the Mac release
        if: needs.source.outputs.mode != 'testflight'
        id: mac
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          CARA_MAC_CERTIFICATE_BASE64: ${{ secrets.CARA_MAC_CERTIFICATE_BASE64 }}
          CARA_MAC_CERTIFICATE_PASSWORD: ${{ secrets.CARA_MAC_CERTIFICATE_PASSWORD }}
          CARA_NOTARY_KEY_BASE64: ${{ secrets.CARA_NOTARY_KEY_BASE64 }}
          CARA_NOTARY_KEY_ID: ${{ secrets.CARA_NOTARY_KEY_ID }}
          CARA_NOTARY_ISSUER_ID: ${{ secrets.CARA_NOTARY_ISSUER_ID }}
        run: |
          python3 tools/sign_nightly.py mac --artifact-dir work/unsigned-mac \
            --source-revision "$EXPECTED_SHA" --output work/signed/Cara-macOS-arm64-JIT-signed.zip
      - name: Sign the iOS release with App Store distribution provisioning
        id: ios
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          CARA_IOS_CERTIFICATE_BASE64: ${{ secrets.CARA_IOS_CERTIFICATE_BASE64 }}
          CARA_IOS_CERTIFICATE_PASSWORD: ${{ secrets.CARA_IOS_CERTIFICATE_PASSWORD }}
          CARA_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.CARA_IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          python3 tools/sign_nightly.py ios --artifact-dir work/unsigned-ios \
            --source-revision "$EXPECTED_SHA" --output work/signed/Cara-iOS-arm64-GLES3-signed.ipa
      - uses: actions/upload-artifact@v4
        if: steps.mac.outputs.signed == 'true' && steps.ios.outputs.signed == 'true'
        with:
          name: signed-apple
          path: work/signed/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: needs.source.outputs.mode == 'testflight' && steps.ios.outputs.signed == 'true'
        with:
          name: testflight-signed-ipa
          path: work/signed/*
          if-no-files-found: error
      - name: Upload the signed IPA to App Store Connect
        if: needs.source.outputs.mode == 'testflight' && steps.ios.outputs.signed == 'true'
        env:
          CARA_NOTARY_KEY_BASE64: ${{ secrets.CARA_NOTARY_KEY_BASE64 }}
          CARA_NOTARY_KEY_ID: ${{ secrets.CARA_NOTARY_KEY_ID }}
          CARA_NOTARY_ISSUER_ID: ${{ secrets.CARA_NOTARY_ISSUER_ID }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          python3 tools/upload_testflight.py work/signed/Cara-iOS-arm64-GLES3-signed.ipa "$EXPECTED_SHA"
      - id: result
        if: steps.mac.outputs.signed == 'true' && steps.ios.outputs.signed == 'true'
        run: echo "signed=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Prepare the verified release
    needs: [source, signing-ready, sign-apple, sign-android]
    if: github.repository == 'dmikey/cara' && github.ref == 'refs/heads/main' && needs.sign-apple.outputs.signed == 'true' && needs.sign-android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-apple
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: signed-android
          path: dist
      - name: Verify exact packages and prepare the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          MODE: ${{ needs.source.outputs.mode }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          ANDROID_CERT_SHA256: ${{ needs.signing-ready.outputs.android_cert }}
        run: |
          set -euo pipefail
          python3 tools/verify_signed_release.py dist --source-revision "$EXPECTED_SHA" \
            --android-cert-sha256 "$ANDROID_CERT_SHA256"
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt)
          printf '%s\n' \
            "Cara build from commit $EXPECTED_SHA." \
            "macOS: Developer ID-signed and notarized Apple Silicon app." \
            "iOS: Apple Distribution IPA for App Store Connect and TestFlight processing." \
            "Android: APK for direct installation and AAB for Play Console, signed with the configured upload key." \
            "Play installs use the Play app-signing key. Use the Play testing track when testing an update from Play." \
            "Verify downloads with SHA256SUMS.txt." > notes.md
          if [[ "$MODE" = nightly ]]; then
            stamp=$(date -u +%Y%m%d)
            tag="nightly-$stamp-${EXPECTED_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            gh release create "$tag" dist/* SHA256SUMS.txt --draft --prerelease --latest=false \
              --target "$EXPECTED_SHA" --title "Cara Nightly $stamp · ${EXPECTED_SHA:0:12}" --notes-file notes.md
            gh release edit "$tag" --draft=false --latest=false
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          elif [[ "$MODE" = tagged ]]; then
            tag=$RELEASE_TAG
            test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$EXPECTED_SHA"
            flags=()
            if [[ "$tag" = *-rc.* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" dist/* SHA256SUMS.txt --draft --verify-tag --latest=false \
              "${flags[@]}" --title "Cara $tag" --notes-file notes.md
            test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$EXPECTED_SHA"
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            exit 1
          fi
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
