name: Native Metal developer builds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-metal.yml'
      - 'emulator/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'tests/metal_queue_policy_test.cpp'
      - 'tests/metal_tev_admission_test.cpp'
      - 'tests/metal_display_transfer_startup_test.mm'
      - 'tests/metal_async_depth_validation_test.mm'
      - 'tests/run_metal_async_depth_validation_test.py'
      - 'tests/metal_fcram_watch_release_test.mm'
      - 'tests/run_metal_fcram_watch_release_test.py'
      - 'tools/build_native_metal.py'
  pull_request:
    paths:
      - '.github/workflows/native-metal.yml'
      - 'emulator/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'tests/metal_queue_policy_test.cpp'
      - 'tests/metal_tev_admission_test.cpp'
      - 'tests/metal_display_transfer_startup_test.mm'
      - 'tests/metal_async_depth_validation_test.mm'
      - 'tests/run_metal_async_depth_validation_test.py'
      - 'tests/metal_fcram_watch_release_test.mm'
      - 'tests/run_metal_fcram_watch_release_test.py'
      - 'tools/build_native_metal.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-metal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: "Native Metal ${{ matrix.name }} / compile and audit"
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            name: macOS / optional CPU JIT
            artifact: mac
            flags: --cpu-jit
          - target: mac
            name: macOS / FastInterp only
            artifact: mac-fastinterp
            flags: ''
          - target: ios
            name: iOS / FastInterp only
            artifact: ios
            flags: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned build tools
        run: |
          python3 -m venv work/tools
          work/tools/bin/python -m pip install cmake==3.31.10 ninja==1.13.2
          echo "$PWD/work/tools/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Install Mac SDL dependencies
        if: matrix.target == 'mac'
        run: brew install sdl2 libpng
      - name: Check adaptive Metal queue transitions
        if: matrix.artifact == 'mac-fastinterp'
        run: |
          xcrun clang++ -std=c++20 -I emulator/src tests/metal_queue_policy_test.cpp -o "$RUNNER_TEMP/metal-queue-policy"
          "$RUNNER_TEMP/metal-queue-policy"
          xcrun clang++ -std=c++20 -I emulator/src tests/metal_tev_admission_test.cpp -o "$RUNNER_TEMP/metal-tev-admission"
          "$RUNNER_TEMP/metal-tev-admission"
      - name: Check exact display-transfer planning without a ROM
        if: matrix.artifact == 'mac-fastinterp'
        run: |
          xcrun clang++ -std=c++20 -fobjc-arc -I emulator/src \
            tests/metal_display_transfer_startup_test.mm \
            emulator/src/video_core/renderer_metal/pica_metal_transfers.mm \
            -framework Metal -framework Foundation -o "$RUNNER_TEMP/metal-transfer-test"
          "$RUNNER_TEMP/metal-transfer-test"
      - name: Build and audit without private shader assets
        run: python3 tools/build_native_metal.py ${{ matrix.target }} ${{ matrix.flags }} --jobs 2
      - name: Link the checked depth round-trip fixture
        if: matrix.artifact == 'mac-fastinterp'
        run: python3 tests/run_metal_async_depth_validation_test.py --build-dir work/build-native-metal-mac --compile-only
      - name: Link the Metal FCRAM page ownership fixture
        if: matrix.artifact == 'mac-fastinterp'
        run: python3 tests/run_metal_fcram_watch_release_test.py --build-dir work/build-native-metal-mac --compile-only
      - uses: actions/upload-artifact@v4
        with:
          name: native-metal-${{ matrix.artifact }}-audit
          path: work/build-native-metal-${{ matrix.target }}/native-metal-audit.json
          if-no-files-found: error
