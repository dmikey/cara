name: Experimental Android GLES + Dynarmic
on:
  workflow_dispatch:
  push:
    branches: [feature/android-gles-dynarmic]
permissions:
  contents: read
concurrency:
  group: android-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare optional pinned JIT source
        run: python3 tools/prepare_android_dynarmic.py
      - name: Install compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ${{ runner.temp }}/cara-ccache
          key: cara-android-ndk29-${{ github.run_id }}
          restore-keys: cara-android-ndk29-
      - name: Build experimental ARM64 APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/cara-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 1G
        working-directory: emulator/src/android
        run: gradle --no-daemon --continue --max-workers=3 :app:assembleDebug
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/cara-ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify APK and native payload
        run: |
          apk=emulator/src/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          unzip -l "$apk" | grep 'lib/arm64-v8a/libmain.so'
          sha256sum "$apk" > android-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cara-android-arm64-gles-dynarmic-experimental
          if-no-files-found: error
          path: |
            emulator/src/android/app/build/outputs/apk/debug/*.apk
            android-apk.sha256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-diagnostics
          if-no-files-found: ignore
          path: |
            emulator/src/android/app/.cxx/**/CMakeFiles/CMakeError.log
            emulator/src/android/app/.cxx/**/CMakeFiles/CMakeConfigureLog.yaml

  jit-smoke:
    name: ARM64 Dynarmic synthetic checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          python3 -m venv work/tools
          work/tools/bin/pip install cmake==3.31.10 ninja==1.13.2
          echo "$PWD/work/tools/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned backend
        run: python3 tools/prepare_android_dynarmic.py
      - name: Build synthetic checks
        run: |
          cmake -S emulator -B work/jit-smoke -G Ninja -DCMAKE_BUILD_TYPE=Release -DCARA_ENABLE_JIT=ON -DCARA_SOFTWARE_PRESENTATION=ON -DENABLE_QT=OFF -DENABLE_SDL2=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DBOOST_ROOT="$PWD/emulator/externals/boost"
          cmake --build work/jit-smoke --target cara-dynarmic-self-test -j 3
      - name: Check arithmetic, context, invalidation and exclusives
        run: work/jit-smoke/bin/cara-dynarmic-self-test
