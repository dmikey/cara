// Modified for Cara on 2026-11-12; see NOTICE for attribution.
apply plugin: 'com.android.application'

def caraPreview = (project.findProperty('caraPreview') ?: 'false').toBoolean()
def caraCpuJit = (project.findProperty('caraCpuJit') ?: 'true').toBoolean()
def caraNotices = layout.buildDirectory.dir('generated/caraNotices')
def copyCaraNotices = tasks.register('copyCaraNotices', Sync) {
    from(rootProject.file('../../..')) {
        include 'LICENSE', 'NOTICE'
        into 'licenses'
    }
    into caraNotices
}

android {
    compileSdkVersion 36
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(caraNotices)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    defaultConfig {
        applicationId "org.cara.emu"
        manifestPlaceholders = [caraAppLabel: caraPreview ? "Cara Mali Preview" : "Cara"]
        buildConfigField "boolean", "CPU_JIT_AVAILABLE", caraCpuJit.toString()
        minSdkVersion 24
        targetSdkVersion 36
        versionCode(providers.gradleProperty("caraReleaseVersionCode").map { Integer.parseInt(it) }
                    .getOrElse(getBuildVersionCode()))
        versionName "${getVersion()}"
    }

    // Define build types, which are orthogonal to product flavors.
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // Signed by debug key disallowing distribution on Play Store.
        // Attaches 'debug' suffix to version and package name, allowing installation alongside the release build.
        debug {
            applicationIdSuffix caraPreview ? ".malipreview" : ".debug"
            versionNameSuffix '-debug'
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
            version '3.31.6'
        }
    }

    ndkVersion = '29.0.14206865'
    lint {
        abortOnError false
    }
    namespace 'org.cara.emu'

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DCARA_ENABLE_JIT=OFF",
                        "-DCARA_ANDROID_GLES_ATLAS=${project.findProperty('caraGlesAtlas') ?: 'ON'}",
                        "-DCARA_ANDROID_CPU_JIT=${caraCpuJit ? 'ON' : 'OFF'}",
                        "-DENABLE_QT=0", // Don't use QT
                        "-DENABLE_SDL2=0", // Don't use SDL
                        "-DENABLE_WEB_SERVICE=0", // Don't use web services
                        "-DANDROID_ARM_NEON=true", // cryptopp requires Neon to work
                        "-DENABLE_CUBEB=1",
                        "-DANDROID_STL=c++_static",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG"
                abiFilters "arm64-v8a"
            }
        }
    }
}

tasks.named("preBuild").configure { dependsOn(copyCaraNotices) }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation "androidx.preference:preference:1.1.1"
    implementation "androidx.core:core-google-shortcuts:1.0.1"
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // Tink reaches these annotations through AndroidX. R8 needs them on the release classpath.
    releaseImplementation 'com.google.errorprone:error_prone_annotations:2.40.0'
}

def getVersion() {
    def versionNumber = '0.0'

    try {
        versionNumber = 'git describe --always --long'.execute([], project.rootDir).text
                .trim()
                .replaceAll(/(-0)?-[^-]+$/, "")
    } catch (Exception e) {
        logger.error('Cannot find git, defaulting to dummy version number')
    }

    return versionNumber
}


def getBuildVersionCode() {
    try {
        def versionNumber = 'git rev-list --first-parent --count HEAD'.execute([], project.rootDir).text
                .trim()
        return Integer.valueOf(versionNumber)
    } catch (Exception e) {
        logger.error('Cannot find git, defaulting to dummy version number')
    }

    return 0
}
