# These zones and hostname are isolated from existing products.
limit_req_zone $binary_remote_addr zone=cara_relay_admit:1m rate=2r/s;
limit_conn_zone $server_name zone=cara_relay_total:1m;
limit_conn_zone $binary_remote_addr zone=cara_relay_per_ip:1m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name carap2p.therad.ninja;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;
    ssl_certificate /etc/letsencrypt/live/carap2p.therad.ninja/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carap2p.therad.ninja/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8k;
    location = /healthz {
        proxy_pass http://127.0.0.1:24874;
        proxy_set_header Host carap2p.therad.ninja;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location = /relay {
        limit_req zone=cara_relay_admit burst=8 nodelay;
        limit_conn cara_relay_total 32;
        limit_conn cara_relay_per_ip 8;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:24874;
        proxy_http_version 1.1;
        proxy_set_header Host carap2p.therad.ninja;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
    }
    location / { return 404; }
}
