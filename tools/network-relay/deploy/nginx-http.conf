# Dedicated hostname only; used to bootstrap its existing webroot ACME flow.
server {
    listen 80;
    listen [::]:80;
    server_name carap2p.therad.ninja;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://carap2p.therad.ninja$request_uri; }
}
